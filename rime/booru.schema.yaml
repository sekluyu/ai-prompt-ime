schema:
  schema_id: booru
  name: 绘画提示词
  version: "0.2.8"
  description: 离线中文拼音选中英提示词、e621与Danbooru标签；逐词选择
switches:
  - name: ascii_mode
    reset: 0
    states: [绘画, 西文]
  - name: booru_separator
    reset: 1
    states: [纯标签, 逗号分隔]
  - name: booru_space
    reset: 1
    states: [不加空格, 添加空格]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, table_translator]
  filters: [lua_filter@*booru_filter]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
translator:
  dictionary: booru
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
  enable_charset_filter: false
menu:
  page_size: 7
punctuator:
  half_shape:
    ',': ', '
    '.': '.'
    ':': ':'
    '(': '('
    ')': ')'
    '[': '['
    ']': ']'
key_binder:
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: always, accept: Control+Alt+F9, toggle: booru_space}
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
